name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novanet
          POSTGRES_PASSWORD: novanet
          POSTGRES_DB: novanet_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novanet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://novanet:novanet@localhost:5432/novanet_portal?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder
      FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST_ci_placeholder
      FLUTTERWAVE_PUBLIC_KEY: FLWPUBK_TEST_ci_placeholder
      FLUTTERWAVE_SECRET_HASH: ci-placeholder-hash
      VOUCHER_SIGNING_SECRET: ci-only-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
